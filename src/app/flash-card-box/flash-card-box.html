<div id="main-fcb">
    <div id="flashcard-view" class={{parentClass()}}>
        <h1>{{name()}}</h1>
        <h3>{{srcLanguage()}} -> {{destLanguage()}}</h3>
        <p>@for (item of listSrc(); track $index) {
            <p class="srcWord">{{item}}</p>
        }</p>
        <button id="startbtn" (click)="beginQuiz()">시작</button>
    </div>
    <app-quiz
    class={{childClass()}}
    id="quizview"
    [listSrc]="listSrc()"
    [listDest]="listDest()"
    ></app-quiz>
    <button (click)="exitQuiz()" class={{childClass()}}>나가기</button>
</div>
